base: &base
  x: 1
  y: 2
copy: *base
merge:
  <<: *base
  z: 3
inline: &b {x: 1}
reuse: *b
tagged: !!str 123
custom: !mytag value
verbatim: !<tag:yaml.org,2002:str> text
local: !e!tag value
bare_tag: ! text
list: &items
  - &first one
  - *first
  - !!int 5
&top key: &val value
*alias : value
amp: & alone
star: * alone
anchor_in_flow: [&f one, *f, !t two]
set: !!set {a, b}
