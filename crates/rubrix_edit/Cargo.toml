[package]
name = "rubrix_edit"
description = "Headless text editing for rubrix: a line buffer, selections, undo and motions."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.rubrix]
no_std = true

[dependencies]
regex = { version = "1.12", optional = true }
regex-syntax = { version = "0.8", optional = true }
rubrix_highlight = { path = "../rubrix_highlight" }
unicode-segmentation = { version = "1.13", default-features = false }

[features]
std = []
find = ["std", "dep:regex", "dep:regex-syntax"]

[lints]
workspace = true
