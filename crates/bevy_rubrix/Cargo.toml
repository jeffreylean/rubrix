[package]
name = "bevy_rubrix"
description = "Code, diff and file-tree UI kit for Bevy."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bevy = { workspace = true, features = [
    "bevy_clipboard",
    "bevy_input_focus",
    "bevy_log",
] }
bevy_fynix = { workspace = true, features = ["std"] }
parley = "=0.11.1"
rubrix_diff = { path = "../rubrix_diff" }
rubrix_edit = { path = "../rubrix_edit", features = ["find"] }
rubrix_highlight = { path = "../rubrix_highlight" }

[dev-dependencies]
bevy = { workspace = true, features = [
    "2d",
    "ui",
    "png",
    "system_clipboard",
    "system_font_discovery",
] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSEvent",
    "NSResponder",
    "NSWindow",
    "objc2-core-graphics",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
] }

[[example]]
name = "gallery"
path = "examples/gallery/main.rs"
test = true

[lints]
workspace = true
