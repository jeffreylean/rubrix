[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor/fynix"]

[workspace.package]
version = "0.0.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeffreylean/rubrix"

[workspace.dependencies]
fynix = { version = "0.0.3", path = "vendor/fynix/crates/fynix", default-features = false }
bevy_fynix = { version = "0.0.3", path = "vendor/fynix/crates/bevy_fynix", default-features = false }

bevy = { version = "=0.20.0", default-features = false }

[workspace.lints.clippy]
redundant_type_annotations = "warn"
