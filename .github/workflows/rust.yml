name: CI
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libudev-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev
      - run: cargo check --workspace --all-features --all-targets

  check-no-defaults:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libudev-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev
      - run: cargo check --workspace --no-default-features

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libudev-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libudev-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev
      - run: cargo doc --workspace --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libudev-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev
      - run: cargo test --workspace

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - run: scripts/check-no-std.sh

  bevy-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - run: scripts/check-bevy-pin.sh

  vendor-fynix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: vendor-fynix
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: vendor/fynix
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libudev-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev
      - run: cargo test --workspace
        working-directory: vendor/fynix
